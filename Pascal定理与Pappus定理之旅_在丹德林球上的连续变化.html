            if (linePH) linePH.visible = showOthers;
            if (lineHK) lineHK.visible = showOthers;
            if (lineHT1) lineHT1.visible = showOthers;
            if (triKHP) triKHP.visible = showOthers;
            if (triT1HP) triT1HP.visible = showOthers;
            if (sphere1) sphere1.visible = true;
            if (sphereEdges1) sphereEdges1.visible = true;
            if (sphere2) sphere2.visible = currentParams && currentParams.lowerValid;
            if (sphereEdges2) sphereEdges2.visible = currentParams && currentParams.lowerValid;
            if (circle1) circle1.visible = true;
            if (circle2) circle2.visible = currentParams && currentParams.lowerValid;
            if (conicLine) conicLine.visible = true;
            if (conicLine2) conicLine2.visible = true;
            if (planeMesh) planeMesh.visible = true;

            const hBtn = document.getElementById('btn-refresh');
            if (hBtn) {
                if (hexVisible) {
                    hBtn.textContent = 'H';
                    // P 激活时：如果 H 未激活，保存当前 P 状态快照
                    if (!hBtn.classList.contains('active')) {
                        savedHexGenerators = hexGenerators.slice();
                        savedHexMode = 'P';
                    }
                } else {
                    // P 不激活时：H 强制变灰且不激活，保存当前 P 状态
                    hBtn.textContent = 'H';
                    hBtn.classList.remove('active');
                    hBtn.style.color = '#888888';
                    savedHexGenerators = hexGenerators.slice();
                    savedHexMode = 'P';
                }
            }
        }

        btnP.addEventListener('click', () => {
            hexVisible = !hexVisible;
            btnP.classList.toggle('active', hexVisible);
            applyHexVisibility();
        });

        const canvasEl = renderer.domElement;

        function onPointerDown(e) {
            if (!hexVisible) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const idx = findHexAt(clientX, clientY);
            if (idx >= 0) {
                draggingHexIdx = idx;
                controls.enabled = false;
                e.preventDefault();
                e.stopPropagation();
            }
        }

        function onPointerMove(e) {
            if (draggingHexIdx < 0) return;
            const hBtnActive = document.getElementById('btn-refresh').classList.contains('active');
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (hBtnActive) {
                // H 激活时：hexGenerators 存储曲线参数，用鼠标在平面上的位置反推曲线参数
                const newT = tFromScreen(clientX, clientY, draggingHexIdx);
                if (newT !== null) {
                    hexGenerators[draggingHexIdx] = newT;
                    let branch = 0;
                    if (currentParams.isHyperbola) branch = 1;
                    const Pt = getConicPoint(currentParams, hexGenerators[draggingHexIdx], branch);
                    if (Pt) {
                        hexPoints[draggingHexIdx].position.copy(Pt);
                        hexLabels[draggingHexIdx].position.copy(Pt);
                    }
                }
            } else {
                // P 模式时：hexGenerators 存储母线角度
                const newTheta = angleFromScreen(clientX, clientY, draggingHexIdx);
                if (newTheta !== null) {
                    hexGenerators[draggingHexIdx] = newTheta;
                    const Pt = getConicPointFromGenerator(currentParams, hexGenerators[draggingHexIdx]);
                    if (Pt) {
                        hexPoints[draggingHexIdx].position.copy(Pt);
                        hexLabels[draggingHexIdx].position.copy(Pt);
                    }
                }
            }

            if (hexVisible && hexPoints.length === 6 && currentParams && !currentParams.isDegenerate) {
                const A = hexPoints[0].position, B = hexPoints[1].position, C = hexPoints[2].position;
                const a = hexPoints[3].position, b = hexPoints[4].position, c = hexPoints[5].position;
                updateHexLine(lineAb, A, b); updateHexLine(lineBa, B, a);
                updateHexLine(lineBc, B, c); updateHexLine(lineCb, C, b);
                updateHexLine(lineCa, C, a); updateHexLine(lineAc, A, c);
                function lineIntersect(p1, p2, p3, p4) {
                    const d1 = new THREE.Vector3().subVectors(p2, p1);
                    const d2 = new THREE.Vector3().subVectors(p4, p3);
                    const diff = new THREE.Vector3().subVectors(p3, p1);
                    const crossD = new THREE.Vector3().crossVectors(d1, d2);
                    const crossDiff = new THREE.Vector3().crossVectors(diff, d2);
                    const lenSq = crossD.lengthSq();
                    if (lenSq < 1e-8) return null;
                    const t = crossDiff.dot(crossD) / lenSq;
                    return p1.clone().addScaledVector(d1, t);
                }
                const iAB = lineIntersect(A, b, B, a);
                const iBC = lineIntersect(B, c, C, b);
                const iCA = lineIntersect(C, a, A, c);
                if (iAB) { interAB.position.copy(iAB); interAB.visible = true; } else { interAB.visible = false; }
                if (iBC) { interBC.position.copy(iBC); interBC.visible = true; } else { interBC.visible = false; }
                if (iCA) { interCA.position.copy(iCA); interCA.visible = true; } else { interCA.visible = false; }
                updateInterLine();
            }
            e.preventDefault();
            e.stopPropagation();
        }

        function onPointerUp(e) {
            draggingHexIdx = -1;
            controls.enabled = true;
        }

        canvasEl.addEventListener('mousedown', onPointerDown);
        canvasEl.addEventListener('mousemove', onPointerMove);
        canvasEl.addEventListener('mouseup', onPointerUp);
        canvasEl.addEventListener('mouseleave', onPointerUp);
        canvasEl.addEventListener('touchstart', onPointerDown, { passive: false });
        canvasEl.addEventListener('touchmove', onPointerMove, { passive: false });
        canvasEl.addEventListener('touchend', onPointerUp);
        canvasEl.addEventListener('touchcancel', onPointerUp);

        function animate() {
            if (!isPlaying) return;
            try {
                const speed = parseInt(document.getElementById('speed-slider').value);
                currentAngle += speed * 0.3;
                if (currentAngle >= 360) currentAngle -= 360;
                isProgrammatic = true;
                document.getElementById('p-slider').value = currentAngle;
                isProgrammatic = false;
                updateScene(currentAngle);
            } catch (e) {
                console.error('Animation error:', e);
            } finally {
                if (isPlaying) {
                    animationId = requestAnimationFrame(animate);
                }
            }
        }

        function render() {
            requestAnimationFrame(render);
            try {
                controls.update();
                renderer.render(scene, camera);
                labelRenderer.render(scene, camera);
            } catch (e) {
                console.error('Render error:', e);
            }
        }
        render();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
